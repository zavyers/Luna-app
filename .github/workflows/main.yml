name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the newest zip
        run: |
          Z=$(ls *.zip | sort | tail -n1)
          echo "Using $Z"
          mkdir -p project
          unzip -q -o "$Z" -d project
          S=$(find project -name 'settings.gradle*' | head -n1)
          if [ -z "$S" ]; then echo "No Android project found in $Z"; exit 1; fi
          echo "APPDIR=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: ${{ env.APPDIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Luna-APK
          path: ${{ env.APPDIR }}/app/build/outputs/apk/debug/*.apk
